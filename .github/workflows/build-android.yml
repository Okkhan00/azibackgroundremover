name: Build Android APK

on:
  # Run it by hand: GitHub -> Actions -> "Build Android APK" -> "Run workflow"
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Also publish a GitHub Release with the APK'
        type: boolean
        default: false
  # Or push a version tag such as v1.0.0 to build and release automatically
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create GitHub Releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: BackgroundRemover-AZI-CREATION
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build the React application
        run: npm run build

      - name: Install Java 21 (required by Capacitor 8 / Android Gradle Plugin 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android files
        run: npx cap sync android

      - name: Work out the version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using the signing key stored in repository secrets."
            echo "$KEYSTORE_B64" | base64 --decode > "$KS"
            STORE_PW="$KEYSTORE_PASSWORD_SECRET"; ALIAS="$KEY_ALIAS_SECRET"; KEY_PW="${KEY_PASSWORD_SECRET:-$KEYSTORE_PASSWORD_SECRET}"
          else
            echo "::warning::No signing secrets found. Creating a temporary key so the APK is installable. Each build gets a different key, so uninstall the old app before installing a new build. See README section 9 to add a permanent key."
            STORE_PW="$(openssl rand -hex 16)"; KEY_PW="$STORE_PW"; ALIAS="azi-temp"
            echo "::add-mask::$STORE_PW"
            keytool -genkeypair -v -keystore "$KS" -storepass "$STORE_PW" -keypass "$KEY_PW" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AZI CREATION, O=AZI CREATION, C=PK"
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PW"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Name the APK
        id: apk
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC" || { echo "::error::Signed release APK was not produced"; ls -R android/app/build/outputs || true; exit 1; }
          OUT="${APP_NAME}-v${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build{1}', steps.ver.outputs.name, github.run_number) }}
          name: Background Remover by AZI CREATION ${{ steps.ver.outputs.name }}
          body: |
            Android APK for **Background Remover by AZI CREATION**.
            Download the `.apk` file below, copy it to your phone and open it to install.
            (You may need to allow "Install unknown apps" for your browser or file manager.)
          files: ${{ steps.apk.outputs.file }}
